# One-time addition to the https server block in
# /etc/nginx/sites-available/candicemillercreations.com on the Linode box,
# alongside the existing `location / { ... }`. Proxies the global
# best-record API through to the local systemd service (see
# shakespeares-monkeys-api.service), which only listens on 127.0.0.1.
location /shakespeares-monkeys/api/ {
    proxy_pass http://127.0.0.1:8787/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
